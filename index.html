<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photorealistic Prompt Generator</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4 md:p-8">
    <div class="w-full max-w-4xl bg-white rounded-lg shadow-lg p-6 md:p-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800">Photorealistic Prompt Generator</h1>
            <p class="text-slate-600 mt-2">Create detailed prompts for photorealistic image generation</p>
        </header>

        <div class="grid md:grid-cols-2 gap-6">
            <div class="space-y-4">
                <!-- Form inputs -->
                <div>
                    <label for="subject" class="block text-sm font-medium text-slate-700 mb-1">Subject</label>
                    <input type="text" id="subject" placeholder="Beautiful mature fat plump muscular Japanese female bodybuilder in bikini string" 
                        class="w-full p-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label for="environment" class="block text-sm font-medium text-slate-700 mb-1">Environment & Mood</label>
                    <input type="text" id="environment" placeholder="In a modern studio with minimalist backdrop" 
                        class="w-full p-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label for="composition" class="block text-sm font-medium text-slate-700 mb-1">Composition & Framing</label>
                    <input type="text" id="composition" placeholder="Full body shot highlighting muscular development" 
                        class="w-full p-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label for="lighting" class="block text-sm font-medium text-slate-700 mb-1">Lighting & Color</label>
                    <input type="text" id="lighting" placeholder="Competition stage lighting with dramatic highlights on muscles" 
                        class="w-full p-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label for="camera" class="block text-sm font-medium text-slate-700 mb-1">Camera & Technical Specs</label>
                    <input type="text" id="camera" placeholder="Canon 5D Mark IV with 70-200mm f/2.8 sports lens" 
                        class="w-full p-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label for="style" class="block text-sm font-medium text-slate-700 mb-1">Style & Quality Keywords</label>
                    <input type="text" id="style" placeholder="Professional bodybuilding competition documentation style" 
                        class="w-full p-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label for="negative" class="block text-sm font-medium text-slate-700 mb-1">Negative Prompts</label>
                    <input type="text" id="negative" placeholder="blurry, out of focus, soft focus, poorly lit muscles" 
                        class="w-full p-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <button id="randomBtn" class="w-full py-2 px-4 bg-purple-600 text-white font-medium rounded-md hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition">
                    Generate Random Prompt
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label for="output" class="block text-sm font-medium text-slate-700 mb-1">Generated Prompt</label>
                    <textarea id="output" readonly rows="12" 
                        class="w-full p-3 border border-slate-300 rounded-md bg-slate-50 focus:outline-none"></textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <button id="copyPositiveBtn" class="w-full py-2 px-4 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                            <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
                        </svg>
                        Copy Positive
                    </button>
                    
                    <button id="copyNegativeBtn" class="w-full py-2 px-4 bg-red-600 text-white font-medium rounded-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                            <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
                        </svg>
                        Copy Negative
                    </button>
                </div>
                
                <div id="copyMessage" class="hidden mt-2 p-2 bg-green-100 text-green-800 rounded-md text-center">
                    Prompt copied to clipboard!
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Photorealistic Prompt Generator
         * A tool for creating detailed prompts for AI image generation
         */
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const elements = {
                inputs: {
                    subject: document.getElementById('subject'),
                    environment: document.getElementById('environment'),
                    composition: document.getElementById('composition'),
                    lighting: document.getElementById('lighting'),
                    camera: document.getElementById('camera'),
                    style: document.getElementById('style'),
                    negative: document.getElementById('negative')
                },
                output: document.getElementById('output'),
                buttons: {
                    random: document.getElementById('randomBtn'),
                    copyPositive: document.getElementById('copyPositiveBtn'),
                    copyNegative: document.getElementById('copyNegativeBtn')
                },
                copyMessage: document.getElementById('copyMessage')
            };

            // Database of options for random generation
            const promptDatabase = {
                subject: [
                    "Beautiful gorgeous bbw thick chubby mature fat plump muscular Japanese female bodybuilder in bikini string",
                    "Cute bbw thick chubby mature plump muscular Japanese female bodybuilder in string bikini",
                    "Gorgeous bbw thick chubby fat muscular Japanese female bodybuilder posing in bikini string",
                    "Beautiful cute thick bbw chubby plump muscular mature Japanese woman in string bikini",
                    "Gorgeous bbw thick chubby plump yet muscular mature Japanese female bodybuilder in bikini string",
                    "Beautiful cute thick bbw chubby muscular fat Japanese female bodybuilder in blue string bikini",
                    "Gorgeous beautiful thick bbw chubby plump Japanese female bodybuilder with defined muscles in string bikini",
                    "Cute bbw thick chubby mature fat muscular Japanese woman bodybuilder in red bikini string",
                    "Beautiful gorgeous thick bbw chubby plump muscular Japanese female bodybuilder in black string bikini",
                    "Cute beautiful bbw thick chubby mature Japanese female bodybuilder with plump muscular physique in bikini string",
                    "Gorgeous thick bbw chubby fat yet defined Japanese female bodybuilder in colorful string bikini",
                    "Beautiful cute bbw thick chubby plump Japanese female with visible muscle tone in bikini string",
                    "Gorgeous thick bbw chubby mature muscular Japanese woman with fuller figure in string bikini",
                    "Cute beautiful thick bbw chubby fat muscular Japanese bodybuilder in purple string bikini",
                    "Beautiful gorgeous bbw thick chubby plump muscular mature Japanese female in gold bikini string",
                    "Cute gorgeous thick bbw chubby mature Japanese female bodybuilder with full figured muscular build in string bikini"
                ],
                environment: [
                    "In a modern studio with minimalist backdrop",
                    "Urban cityscape at golden hour",
                    "Natural outdoor setting with soft foliage",
                    "Beach scene with ocean waves in background",
                    "Cozy indoor home environment with natural light",
                    "Professional studio with neutral backdrop",
                    "Artistic setting with creative lighting",
                    "City streets during blue hour",
                    "Historic architecture with classical elements",
                    "Industrial warehouse with exposed brick and metal",
                    "Mountain landscape with dramatic vista",
                    "Luxury hotel room with elegant decor",
                    "Traditional Japanese garden with cherry blossoms",
                    "Urban rooftop with city skyline",
                    "Tropical resort with palm trees and pools",
                    "Modern architectural setting with clean lines"
                ],
                composition: [
                    "Full body shot highlighting muscular development",
                    "Three-quarter pose emphasizing muscle definition",
                    "Classical bodybuilding front double bicep pose",
                    "Side chest pose showcasing upper body development",
                    "Competition stance with professional posing technique",
                    "Dynamic action shot mid-flexing muscles",
                    "Portrait framing with emphasis on facial determination and upper body",
                    "Symmetrical composition highlighting muscular balance",
                    "Low angle shot emphasizing power and strength",
                    "Classic V-taper pose emphasizing shoulders and back",
                    "Detail shot focusing on specific muscle definition",
                    "Wide shot showcasing full physique in competition stance",

                ],
                lighting: [
                    "Competition stage lighting with dramatic highlights on muscles",
                    "Studio lighting emphasizing muscle separation and definition",
                    "Rim lighting to highlight muscular contours",
                    "Side lighting accentuating muscle striations and detail",
                    "Golden hour natural light creating warm tones on skin",
                    "High-contrast lighting emphasizing muscle depth",
                    "Split lighting to showcase muscular symmetry",
                    "Overhead lighting casting defined shadows on muscle groups",
                    "Dramatic spotlighting focusing on peak muscle development",
                    "Soft diffused light showing natural skin tone with muscle definition",
                    "Cross-lighting to reveal maximum muscular detail",
                    "Competition-style harsh front lighting showing complete definition",
                    "Bodybuilding-specific three-point lighting emphasizing cuts",
                    "Colored gel accents highlighting specific muscle groups",
                    "Low-key lighting creating dramatic muscular shadows",
                    "Beauty-style clamshell lighting balancing strength with femininity"
                ],
                camera: [
                    "Canon 5D Mark IV with 70-200mm f/2.8 sports lens",
                    "Sony A1 with 35mm f/1.4 GM lens for environmental portraits",
                    "Nikon Z9 with 24-70mm f/2.8 at 50mm for competition coverage",
                    "Medium format Hasselblad H6D-100c for ultimate skin and muscle detail",
                    "Canon EOS R5 with 85mm f/1.2 for studio bodybuilding portraits",
                    "Sony A7R IV with 135mm f/1.8 GM lens for muscle detail",
                    "Fujifilm GFX 100S medium format with 110mm f/2 portrait lens",
                    "Nikon D850 with 105mm f/1.4 for bodybuilding competition shots",
                    "Canon EOS R3 with 24-70mm f/2.8 L for dynamic fitness action",
                    "RED DSMC2 with Helium 8K sensor for professional video and stills",
                    "Blackmagic URSA Mini Pro 12K for high-resolution fitness coverage",
                    "Phase One IQ4 150MP for competition documentary coverage",
                    "Fujifilm X-H2 with 56mm f/1.2 for candid backstage moments",
                    "Panasonic S1H with 24-105mm f/4 for hybrid photo/video documentation",
                    "Leica SL2 with 90mm f/2 APO-Summicron for artistic fitness portraits",
                    "Sony FX3 with 50mm T1.5 cinema lens for dramatic bodybuilding portraits"
                ],
                style: [
                    "Professional bodybuilding competition documentation style",
                    "High-end fitness magazine editorial quality",
                    "Sports physique photography with emphasis on muscle detail",
                    "Glossy fitness magazine cover style with dramatic lighting",
                    "Documentary-style authentic training and competition moments",
                    "Clean sports photography with neutral background and perfect detail",
                    "Artistic fitness portrait with emphasis on form and aesthetics",
                    "Commercial fitness advertising with polished, professional look",
                    "Inspirational transformation photography style",
                    "High-contrast black and white emphasizing muscle definition",
                    "Japanese fitness magazine editorial style with cultural elements",
                    "Cinematic color grading with sports documentary aesthetic",
                    "Modern fitness influencer style with vibrant, bold colors",
                    "Classic bodybuilding photography inspired by golden era physiques",
                    "Professional competition portfolio with technical precision",
                    "Strength-focused artistic photography with dramatic shadows"
                ],
                negative: [
                    "blurry, out of focus, soft focus, poorly lit muscles",
                    "distorted body proportions, unrealistic anatomy, warped features",
                    "unflattering angles, awkward poses, poor composition",
                    "overprocessed skin, plastic appearance, excessive retouching",
                    "unprofessional photography, amateur quality, poor lighting",
                    "missing muscle definition, flat lighting, lack of contrast",
                    "cartoonish appearance, non-photorealistic rendering, digital art",
                    "incorrect bodybuilding poses, anatomically impossible positions",
                    "grainy, noisy, low resolution, pixelated",
                    "oversaturated colors, unnatural skin tones, excessive HDR",
                    "distracting backgrounds, cluttered composition, busy elements",
                    "unflattering facial expressions, closed eyes, awkward look",
                    "incorrect muscle anatomy, physiologically impossible definition",
                    "poor competition attire fit, wardrobe malfunction, unprofessional appearance",
                    "bad stage lighting, harsh unflattering shadows, blown highlights",
                    "uneven tan, streaky competition color, patchy application"
                ]
            };

            /**
             * Initialize the application
             */
            function init() {
                // Set up event listeners
                attachEventListeners();
            }

            /**
             * Set up all event listeners
             */
            function attachEventListeners() {
                // Input changes
                Object.values(elements.inputs).forEach(input => {
                    input.addEventListener('input', updatePrompt);
                });
                
                // Button clicks
                elements.buttons.random.addEventListener('click', generateRandomPrompt);
                elements.buttons.copyPositive.addEventListener('click', copyPositivePrompt);
                elements.buttons.copyNegative.addEventListener('click', copyNegativePrompt);
            }

            /**
             * Update the output prompt when inputs change
             */
            function updatePrompt() {
                const promptParts = [
                    elements.inputs.subject.value,
                    elements.inputs.environment.value,
                    elements.inputs.composition.value,
                    elements.inputs.lighting.value,
                    elements.inputs.camera.value,
                    elements.inputs.style.value
                ];
                
                // Filter out empty parts and join with semicolons
                const positivePrompt = promptParts
                    .filter(part => part.trim() !== '')
                    .join('; ');
                
                // Get negative prompt if any
                const negativePrompt = elements.inputs.negative.value.trim();
                
                // Update output - separating positive and negative prompts
                if (negativePrompt) {
                    elements.output.value = `${positivePrompt}\n\nNegative: ${negativePrompt}`;
                } else {
                    elements.output.value = positivePrompt;
                }
            }

            /**
             * Generate a random item from an array
             */
            function getRandomItem(array) {
                return array[Math.floor(Math.random() * array.length)];
            }

            /**
             * Generate and fill random prompt data
             */
            function generateRandomPrompt() {
                // Fill positive inputs with random data
                Object.keys(elements.inputs).forEach(key => {
                    if (key !== 'negative') {
                        elements.inputs[key].value = getRandomItem(promptDatabase[key]);
                    }
                });
                
                // Generate a random negative prompt
                elements.inputs.negative.value = getRandomItem(promptDatabase.negative);
                
                // Update the prompt
                updatePrompt();
            }

            /**
             * Copy positive prompt to clipboard
             */
            function copyPositivePrompt() {
                if (!elements.output.value.trim()) return;
                
                // Extract positive prompt
                let positivePrompt;
                if (elements.output.value.includes('\n\nNegative:')) {
                    positivePrompt = elements.output.value.split('\n\nNegative:')[0].trim();
                } else {
                    positivePrompt = elements.output.value.trim();
                }
                
                // Copy to clipboard
                copyToClipboard(positivePrompt);
                
                // Show success message
                showCopyMessage('Positive prompt copied!');
            }

            /**
             * Copy negative prompt to clipboard
             */
            function copyNegativePrompt() {
                if (!elements.output.value.trim()) return;
                
                // Check if there's a negative prompt
                if (elements.output.value.includes('\n\nNegative:')) {
                    const negativePrompt = elements.output.value.split('\n\nNegative:')[1].trim();
                    
                    // Copy to clipboard
                    copyToClipboard(negativePrompt);
                    
                    // Show success message
                    showCopyMessage('Negative prompt copied!');
                } else {
                    // Show message that there's no negative prompt
                    showCopyMessage('No negative prompt to copy');
                }
            }

            /**
             * Copy text to clipboard using modern clipboard API when available
             */
            function copyToClipboard(text) {
                // Try to use modern clipboard API if available
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).catch(() => {
                        // Fallback to older method if clipboard API fails
                        copyWithExecCommand(text);
                    });
                } else {
                    // Fallback for older browsers
                    copyWithExecCommand(text);
                }
            }

            /**
             * Fallback copy method using execCommand
             */
            function copyWithExecCommand(text) {
                // Create a temporary textarea
                const tempElement = document.createElement('textarea');
                tempElement.value = text;
                tempElement.style.position = 'absolute';
                tempElement.style.left = '-9999px';
                document.body.appendChild(tempElement);
                
                // Select and copy
                tempElement.select();
                document.execCommand('copy');
                
                // Clean up
                document.body.removeChild(tempElement);
            }

            /**
             * Show copy success/error message
             */
            function showCopyMessage(message) {
                elements.copyMessage.textContent = message;
                elements.copyMessage.classList.remove('hidden');
                
                // Hide message after delay
                setTimeout(() => {
                    elements.copyMessage.classList.add('hidden');
                }, 2000);
            }

            // Initialize the application
            init();
        });
    </script>
</body>
</html>
